timeout = 20
max_retries = 3
cache = true
# Treat cached URL results as fresh for a week (default is 1d) — cuts re-checks
# of stable internal links and reduces flakiness against rate-limited hosts.
max_cache_age = "7d"
accept = ["100..=103", "200..=299", "429"]
# External reference hosts (BugGuide, Moth Photographers Group, BAMONA) are
# linked per species from data/species-links.csv (~2400 links). Excluded from
# validation to keep the link check fast and non-flaky — these third-party hosts
# rate-limit.
#
# Institution hosts on the Site Credits page (Smithsonian, AMNH, U. Alberta,
# JBLM/.mil) sit behind WAF/bot-protection that intermittently returns 403 to
# automated checkers while serving 200 to browsers. Excluded to keep the link
# check non-flaky; these URLs are verified to load in a browser.
#
# The site's own page URLs. Every page carries an absolute `rel=canonical` and
# `og:url` pointing at production (issue #198), and lychee extracts the canonical
# link like any other `<link href>`. Checking those would validate the *deployed*
# site rather than the build under test: a PR that adds a page would fail the link
# check for the entirely correct reason that the page is not deployed yet. The
# trailing slash matches directory-style page permalinks only, so CDN assets on the
# same host (`/species-tiles/…_thumbnail.webp?width=530`, `/plates/…/thumbnail.jpg`)
# are still checked.
exclude = ["^https://moths\\.pnwinsects\\.org/[^?]*/$", "\\.(?:jpg|jpeg|png|gif|webp|svg|ico)$", "bugguide\\.net", "mothphotographersgroup\\.msstate\\.edu", "butterfliesandmoths\\.org", "naturalhistory\\.si\\.edu", "amnh\\.org", "ualberta\\.ca", "army\\.mil", "cbif\\.gc\\.ca"]
remap = ["(file://.+/_site)/pnwmoths(.*) $1$2"]
