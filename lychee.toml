timeout = 20
max_retries = 3
cache = true
accept = ["100..=103", "200..=299", "429"]
# External reference hosts (BugGuide, Moth Photographers Group, BAMONA) are
# linked per species from data/species-links.csv (~2400 links). Excluded from
# validation to keep the link check fast and non-flaky — these third-party hosts
# rate-limit.
exclude = ["\\.(?:jpg|jpeg|png|gif|webp|svg|ico)$", "bugguide\\.net", "mothphotographersgroup\\.msstate\\.edu", "butterfliesandmoths\\.org"]
remap = ["(file://.+/_site)/pnwmoths(.*) $1$2"]
