name: Nightly Analytics

on:
  schedule:
    # 8 AM UTC = midnight PST — yesterday's logs are complete
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Defaults to yesterday.'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Push below authenticates with an explicit token instead of the
          # persisted credential, so keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Fetch analytics
        run: node scripts/fetch-analytics.ts
        env:
          BUNNY_ACCOUNT_API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          ANALYTICS_DATE: ${{ inputs.date || '' }}

      - name: Commit analytics data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics/
          if git diff --cached --quiet; then
            echo "No new analytics data to commit."
          else
            latest="$(basename "$(ls -t data/analytics/*.json | head -1)" .json)"
            branch="data/analytics-${latest}"
            git checkout -b "${branch}"
            git commit -m "data: add analytics for ${latest}"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}"
            # Branch protection prevents direct pushes to main; open a PR
            # instead and enable auto-merge so it lands once "build" passes.
            pr_number="$(gh pr view "${branch}" --json number -q '.number' 2>/dev/null || true)"
            if [ -z "${pr_number}" ]; then
              if ! pr_number="$(gh pr create \
                --title "data: add analytics for ${latest}" \
                --body "Automated nightly analytics data update." \
                --head "${branch}" \
                --base main \
                --json number \
                -q '.number' 2>&1)"; then
                if printf '%s\n' "${pr_number}" | grep -Fq "GitHub Actions is not permitted to create or approve pull requests"; then
                  echo "::warning::Pushed ${branch}, but GITHUB_TOKEN cannot open pull requests in this repository. Create one manually or enable 'Allow GitHub Actions to create and approve pull requests'."
                  echo "Compare URL: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
                  exit 0
                fi
                printf '%s\n' "${pr_number}" >&2
                exit 1
              fi
            fi
            gh pr merge --auto --squash "${pr_number}"
          fi
