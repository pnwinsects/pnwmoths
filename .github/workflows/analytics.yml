name: Nightly Analytics

on:
  schedule:
    # 8 AM UTC = midnight PST — yesterday's logs are complete
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Defaults to yesterday.'
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Fetch analytics
        run: node scripts/fetch-analytics.ts
        env:
          BUNNY_ACCOUNT_API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          ANALYTICS_DATE: ${{ inputs.date || '' }}

      - name: Upload analytics to Bunny Storage
        run: node scripts/upload-analytics.ts
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          ANALYTICS_DATE: ${{ inputs.date || '' }}

      - name: Trigger production deploy
        run: gh workflow run production.yml
        env:
          GH_TOKEN: ${{ github.token }}
