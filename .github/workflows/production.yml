name: Deploy to Production (Bunny)
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: TS-only invariant guard
        run: bash scripts/check-ts-only.sh
      - uses: ./.github/actions/install-lychee
        with:
          version: '0.23.0'
      - name: Cache lychee URL results
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-
      - run: npm run build:data && npm run build:key && npm run build:eleventy && npm run build:copy-parquet && npm run build:copy-key-matrix && npm run build:check-key-weight && npm run build:copy-images && npm run build:species-states && npm run build:pagefind && npm run build:check-weight
      - name: Verify Parquet schema
        run: npm run verify:parquet
      - name: Check links (non-blocking)
        run: npm run build:validate-links
        continue-on-error: true
      - name: Upload _site to Bunny
        run: npm run site:upload
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
