name: Deploy to Production (Bunny)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Builds run in parallel, one per push: nothing here touches the CDN, so there is
# nothing to serialise. Only the deploy job queues, so a push waits behind an
# earlier upload only for the upload itself, not for its own typecheck, tests and
# build (issue #308 describes how a stuck deploy once blocked every later push).
jobs:
  build:
    runs-on: ubuntu-26.04
    # The environment is for its secret (the analytics download needs the Bunny
    # password), not for serialising: environments do not queue runs, concurrency
    # groups do.
    environment: production
    outputs:
      analytics-complete: ${{ steps.analytics.outputs.complete }}
      analytics-report: ${{ steps.analytics.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git push here; keep token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install DuckDB extensions (spatial, httpfs)
        uses: ./.github/actions/install-duckdb-extensions
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: TS-only invariant guard
        run: bash scripts/check-ts-only.sh
      - uses: ./.github/actions/install-lychee
        with:
          version: '0.23.0'
      # Each day's analytics file never changes once uploaded, so the files
      # downloaded by earlier deploys are kept in the Actions cache and only new
      # or changed ones are fetched. A download that fails does not stop the
      # deploy: the script keeps the cached copy, exits 2, and the
      # analytics-issue job below opens a tracking issue (#450, ADR 0058).
      - name: Restore analytics downloaded by earlier deploys
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/analytics
          key: analytics-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analytics-
      - name: Download analytics from Bunny Storage
        id: analytics
        # Exit 0 means complete and 2 means incomplete; only those two mean the
        # download ran. Anything else is a malfunction and fails the build, so
        # it can never be reported as "all files downloaded" (ADR 0028).
        run: |
          fingerprint() { cat data/analytics/*.json 2>/dev/null | sha256sum; }
          before=$(fingerprint)
          set +e
          node scripts/download-analytics.ts
          status=$?
          set -e
          case "$status" in
            0) echo "complete=true" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "complete=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Analytics incomplete::Some analytics files could not be downloaded from Bunny; the deploy continues without them. See the tracking issue."
              {
                echo 'report<<ANALYTICS_REPORT_EOF'
                cat analytics-report.md
                echo 'ANALYTICS_REPORT_EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$status" ;;
          esac
          # Re-saving a cache that nothing changed would only crowd out others.
          if [ "$(fingerprint)" != "$before" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          ANALYTICS_REPORT: analytics-report.md
      # Saved now rather than at the end of the job, so a later failure in the
      # build does not throw away what this run downloaded.
      - name: Keep the analytics for the next deploy
        if: steps.analytics.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/analytics
          key: analytics-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build site
        run: npm run build:site
      # Blocking, and deliberately BEFORE the upload: this is the gate that
      # would have stopped the frozen bundle of PR #315 from reaching the CDN
      # (issue #316, ADR 0035). deploy:smoke below checks a different thing —
      # that the CDN is serving what we just uploaded, not that it works.
      - name: Browser smoke test
        run: npm run smoke:browser
      - name: Check links (non-blocking)
        run: npm run build:validate-links
        continue-on-error: true
        env:
          # Authenticates lychee's github.com checks; anonymous runner IPs hit the
          # API rate limit and get 404s that read as link rot (see pr-check.yml).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment: production
    # One upload at a time, and only one waiting behind it: a newer push replaces
    # a waiting one, which is safe because every build contains all earlier commits.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write # require-current-tip cancels a run that a newer push overtook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git push here; keep token out of .git/config
      # Builds finish in any order, so a slow build of an older commit can reach
      # this point after a newer commit has already deployed, and a re-run always
      # checks out its original commit. Uploading either would put older files over
      # newer ones, because the upload overwrites changed files. So the deploy stops
      # unless this commit is still the tip: cancelled (grey) when a newer commit's
      # run will deploy it, red for a re-run, never green (ADR 0053).
      - name: Refuse to deploy a superseded commit
        uses: ./.github/actions/require-current-tip
        with:
          token: ${{ github.token }}
          phase: before setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Fetch the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      # Last check before the upload, the first change to production: a merge can
      # land while the job sets up.
      - name: Re-check the tip before uploading
        uses: ./.github/actions/require-current-tip
        with:
          token: ${{ github.token }}
          phase: before the upload
      - name: Upload _site to Bunny
        run: npm run site:upload
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
      - name: CDN smoke check
        run: npm run deploy:smoke

  # Raises or resolves the issue that tracks an incomplete analytics download.
  # A job of its own so that the build job, which runs every npm dependency,
  # never holds a token that can write issues; and so that two builds finishing
  # together cannot both open an issue. Deploy does not wait for it.
  analytics-issue:
    needs: build
    # Runs even when a later build step failed, because the download result is
    # still true. Skipped when the download never ran or malfunctioned, since
    # then there is nothing true to report.
    if: always() && needs.build.outputs.analytics-complete != ''
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    concurrency:
      group: analytics-issue
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: 'Production build could not download all analytics files'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking issue
        if: needs.build.outputs.analytics-complete == 'false'
        env:
          REPORT: ${{ needs.build.outputs.analytics-report }}
        run: |
          # Built with printf rather than a heredoc: a heredoc inside a YAML
          # block scalar carries the block's indentation into every line, which
          # markdown then renders as one big code block.
          {
            printf '%s\n' "$REPORT"
            printf '%s\n\n' 'This is usually Bunny Storage failing for a while, not a fault in the repo. Each later production deploy retries the download, and this issue closes itself when one gets every file.'
            printf '[Workflow run](%s)\n' "$RUN_URL"
          } > issue-body.md
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\") | .number] | .[0] // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file issue-body.md
          fi
      - name: Close the tracking issue
        if: needs.build.outputs.analytics-complete == 'true'
        run: |
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\") | .number] | .[0] // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "A production build downloaded every analytics file again. [Workflow run](${RUN_URL})"
            echo "closed issue #$existing"
          fi
