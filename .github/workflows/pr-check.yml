name: PR Check
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false # no git push here; keep token out of .git/config
      - name: Detect changed data files
        id: changed-data
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            data/images.csv
            data/glossary.csv
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install DuckDB extensions (spatial, httpfs)
        uses: ./.github/actions/install-duckdb-extensions
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: TS-only invariant guard
        run: bash scripts/check-ts-only.sh
      - uses: ./.github/actions/install-lychee
        with:
          version: '0.23.0'
      - name: Cache lychee URL results
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-
      - name: Build site (with blocking link check)
        run: npm run build
      - name: Check new CDN image URLs
        if: steps.changed-data.outputs.any_changed == 'true'
        run: |
          python3 .github/scripts/check-cdn-urls.py
          lychee --timeout 20 --max-retries 3 --accept '100..=103,200..=299,429' new-image-urls.txt
