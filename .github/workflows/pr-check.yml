name: PR Check
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # no git push here; keep token out of .git/config
      - name: Detect changed data files
        id: changed-data
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            data/images.csv
            data/glossary.csv
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install DuckDB extensions (spatial, httpfs)
        uses: ./.github/actions/install-duckdb-extensions
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: TS-only invariant guard
        run: bash scripts/check-ts-only.sh
      - uses: ./.github/actions/install-lychee
        with:
          version: '0.23.0'
      - name: Build site (with blocking link check)
        run: npm run build
        env:
          # lychee resolves github.com links through the GitHub API. Unauthenticated,
          # the shared runner IPs exhaust the anonymous rate limit and the API answers
          # 404, which lychee reports as a broken link — so a public, working URL like
          # github.com/pnwinsects/pnwmoths/issues intermittently fails the blocking
          # link check. The token raises the limit; lychee reads it from this env var.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs the bundle, not the sources — the one gate that can see a component
      # that rendered once and froze (issue #316, ADR 0035). The runner image
      # preinstalls Google Chrome, which playwright-core drives directly; there
      # is no browser download step.
      - name: Browser smoke test
        run: npm run smoke:browser
      - name: Check new CDN image URLs
        if: steps.changed-data.outputs.any_changed == 'true'
        run: |
          python3 .github/scripts/check-cdn-urls.py
          lychee --timeout 20 --max-retries 3 --accept '100..=103,200..=299,429' new-image-urls.txt
