version: 2

# One pull request a month covering every update, npm and GitHub Actions
# together, instead of one pull request per package each week. Several of those
# were superseded by the next week's bump before anyone merged them. Ignore rules
# below still apply inside the group.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      # @types/node's major tracks the Node major line, and .nvmrc pins Node 24 (LTS).
      # Accepting a major here lets tsc vouch for APIs the runtime doesn't have — and
      # `tsc --noEmit` is the only gate that would catch it. Bump this alongside .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']
